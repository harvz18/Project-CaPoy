# Render Blueprint for the no-cost TaskLink administrator API only.
# Existing static web/portal services remain unmanaged by this Blueprint.
services:
  - type: web
    name: tasklink-admin-api
    runtime: node
    plan: free
    branch: tasklink
    rootDir: admin-api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: tasklink-fb027
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_PORTAL_ORIGINS
        sync: false
