services:
  - type: web
    name: tasklink-control
    runtime: static
    rootDir: admin-portal
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Serve the React app for direct visits and browser refreshes on its
    # client-side routes, such as /admin/dashboard.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_ADMIN_API_BASE_URL
        sync: false
