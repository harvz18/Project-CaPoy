<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MULTIVENT venue map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f3f2; }
      #map, .leaflet-container { font-family: Arial, sans-serif; touch-action: none; }
      .multivent-venue-marker { display: block; position: relative; width: 28px; height: 28px; box-sizing: border-box; border: 3px solid #fff; border-radius: 50% 50% 50% 0; background: #7d1832; box-shadow: 0 2px 8px rgba(56, 8, 22, .38); transform: rotate(-45deg); }
      .multivent-venue-marker::after { position: absolute; top: 7px; left: 7px; width: 8px; height: 8px; border-radius: 50%; background: #fff; content: ''; }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Venue map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
      const parameters = new URLSearchParams(window.location.search)
      const mapTilerKey = parameters.get('key') || ''
      const latitude = Number(parameters.get('lat')) || 10.6765
      const longitude = Number(parameters.get('lng')) || 122.9511
      window.history.replaceState({}, '', window.location.pathname)

      const postToHost = (payload) => {
        const message = JSON.stringify(payload)
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(message)
        else if (window.parent !== window) window.parent.postMessage(payload, '*')
      }

      const map = L.map('map', { attributionControl: true, zoomControl: true }).setView([latitude, longitude], 15)
      if (mapTilerKey) {
        let reportedMapError = false
        const tiles = L.tileLayer(`https://api.maptiler.com/maps/streets-v2/256/{z}/{x}/{y}.png?key=${mapTilerKey}`, {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a>',
          maxZoom: 19,
          tileSize: 256,
        })
        tiles.on('tileerror', () => {
          if (reportedMapError) return
          reportedMapError = true
          postToHost({ source: 'multivent-maptiler', type: 'map-error' })
        })
        tiles.addTo(map)
      }

      const markerIcon = L.divIcon({
        className: 'multivent-venue-marker-wrap',
        html: '<span class="multivent-venue-marker" aria-hidden="true"></span>',
        iconAnchor: [14, 28],
        iconSize: [28, 28],
      })
      let marker = L.marker([latitude, longitude], { draggable: true, icon: markerIcon }).addTo(map)
      let locationLookupRequest = 0
      let locationLookupTimer
      const locationResolutionDebounceMs = 240
      const locationCache = new Map()
      const roundedCoordinates = (latlng) => ({
        latitude: Number(latlng.lat.toFixed(6)),
        longitude: Number(latlng.lng.toFixed(6)),
      })
      const distanceInKilometres = (first, second) => {
        const radians = (value) => (value * Math.PI) / 180
        const latitudeDelta = radians(second.latitude - first.latitude)
        const longitudeDelta = radians(second.longitude - first.longitude)
        const firstLatitude = radians(first.latitude)
        const secondLatitude = radians(second.latitude)
        const haversine = Math.sin(latitudeDelta / 2) ** 2
          + Math.cos(firstLatitude) * Math.cos(secondLatitude) * Math.sin(longitudeDelta / 2) ** 2
        return 6371 * 2 * Math.atan2(Math.sqrt(haversine), Math.sqrt(1 - haversine))
      }
      const textFromFeature = (feature, field) => (
        typeof feature?.[field] === 'string' && feature[field].trim() ? feature[field].trim() : ''
      )
      const resolveLocation = async (coordinates, requestId) => {
        const cacheKey = `${coordinates.latitude.toFixed(6)},${coordinates.longitude.toFixed(6)}`
        const cachedLocation = locationCache.get(cacheKey)
        if (cachedLocation) {
          if (locationLookupRequest === requestId) {
            postToHost({ source: 'multivent-maptiler', type: 'location-resolved', ...coordinates, ...cachedLocation })
          }
          return
        }
        if (!mapTilerKey) {
          postToHost({ source: 'multivent-maptiler', type: 'location-unresolved', ...coordinates })
          return
        }

        try {
          let name = ''
          let address = ''
          const poiResponse = await fetch(
            `https://api.maptiler.com/geocoding/${coordinates.longitude.toFixed(6)},${coordinates.latitude.toFixed(6)}.json?key=${encodeURIComponent(mapTilerKey)}&language=en&types=poi&limit=1`
          )
          if (poiResponse.ok) {
            const poiPayload = await poiResponse.json()
            const poi = Array.isArray(poiPayload.features) ? poiPayload.features[0] : undefined
            const center = Array.isArray(poi?.center) ? poi.center : []
            const poiLongitude = typeof center[0] === 'number' ? center[0] : NaN
            const poiLatitude = typeof center[1] === 'number' ? center[1] : NaN
            const poiIsAtPin = Number.isFinite(poiLatitude)
              && Number.isFinite(poiLongitude)
              && distanceInKilometres(coordinates, { latitude: poiLatitude, longitude: poiLongitude }) <= 0.05
            if (poiIsAtPin) {
              name = textFromFeature(poi, 'text')
              address = textFromFeature(poi, 'place_name')
            }
          }

          if (!name || !address) {
            const reverseResponse = await fetch(
              `https://api.maptiler.com/geocoding/${coordinates.longitude.toFixed(6)},${coordinates.latitude.toFixed(6)}.json?key=${encodeURIComponent(mapTilerKey)}&language=en&limit=1`
            )
            if (reverseResponse.ok) {
              const reversePayload = await reverseResponse.json()
              const result = Array.isArray(reversePayload.features) ? reversePayload.features[0] : undefined
              name = name || textFromFeature(result, 'text')
              address = address || textFromFeature(result, 'place_name')
            }
          }

          if (locationLookupRequest !== requestId) return
          if (!name && !address) {
            postToHost({ source: 'multivent-maptiler', type: 'location-unresolved', ...coordinates })
            return
          }
          const resolvedLocation = { name: name || address, address: address || name }
          locationCache.set(cacheKey, resolvedLocation)
          postToHost({
            source: 'multivent-maptiler',
            type: 'location-resolved',
            ...coordinates,
            ...resolvedLocation,
          })
        } catch {
          if (locationLookupRequest === requestId) {
            postToHost({ source: 'multivent-maptiler', type: 'location-unresolved', ...coordinates })
          }
        }
      }
      const scheduleLocationResolution = (coordinates) => {
        locationLookupRequest += 1
        const requestId = locationLookupRequest
        if (locationLookupTimer) clearTimeout(locationLookupTimer)
        locationLookupTimer = setTimeout(() => {
          void resolveLocation(coordinates, requestId)
        }, locationResolutionDebounceMs)
      }
      const reportPin = (latlng) => {
        const coordinates = roundedCoordinates(latlng)
        postToHost({ source: 'multivent-maptiler', type: 'pin', ...coordinates })
        scheduleLocationResolution(coordinates)
      }
      marker.on('dragend', () => reportPin(marker.getLatLng()))
      map.on('click', (event) => {
        marker.setLatLng(event.latlng)
        reportPin(event.latlng)
      })
      window.multiventSetPin = (command) => {
        if (!command || command.source !== 'multivent-maptiler-command' || command.action !== 'set-pin'
          || typeof command.latitude !== 'number' || typeof command.longitude !== 'number') return
        const nextLocation = L.latLng(command.latitude, command.longitude)
        locationLookupRequest += 1
        if (locationLookupTimer) clearTimeout(locationLookupTimer)
        marker.setLatLng(nextLocation)
        if (command.recenter === true) map.panTo(nextLocation)
      }
    </script>
  </body>
</html>
